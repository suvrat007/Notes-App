<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) is non-zero on notched devices -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="description" content="FORGE — gamified habit and task tracker." />
    <!--
      Standalone display. "mobile-web-app-capable" is the modern spelling and
      is what iOS 16.4+ reads; the apple-prefixed one is still required by
      older iOS, which ignores the modern name and would open FORGE in a
      Safari tab with the address bar showing.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS uses this for the home-screen label, NOT the manifest name. -->
    <meta name="apple-mobile-web-app-title" content="FORGE" />
    <!-- Stops iOS turning dates and numbers in habit names into phone links. -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Windows tile colour; Edge/Chrome on desktop read theme-color above. -->
    <meta name="msapplication-TileColor" content="#0d0f12" />
    <title>FORGE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
