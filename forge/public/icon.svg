<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable: all meaning sits inside the central 80% safe circle (r=205). -->
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6cabd"/>
      <stop offset="100%" stop-color="#a29484"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#0d0f12"/>

  <!-- Anvil -->
  <g fill="url(#ember)">
    <path d="M150 250 h212 c0 0 -10 34 -46 40 v16 h30 v26 H166 v-26 h30 v-16 c-36 -6 -46 -40 -46 -40 z"/>
    <path d="M362 250 c26 -4 44 -14 52 -26 6 -9 -2 -18 -12 -14 -14 6 -28 8 -40 8 z"/>
  </g>

  <!-- Hammer, struck at an angle -->
  <g transform="rotate(-34 256 190)">
    <rect x="246" y="120" width="20" height="130" rx="8" fill="#8a929e"/>
    <rect x="196" y="96" width="120" height="52" rx="12" fill="url(#ember)"/>
  </g>

  <!-- Sparks -->
  <g fill="#d6cabd">
    <circle cx="176" cy="214" r="7"/>
    <circle cx="150" cy="188" r="5"/>
    <circle cx="196" cy="180" r="4"/>
  </g>
</svg>
