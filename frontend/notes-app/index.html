<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="description" content="Forge — a gamified productivity and habit tracker" />
    <!--
      Standalone display. "mobile-web-app-capable" is the modern spelling and
      what iOS 16.4+ reads; the apple-prefixed one is still required by older
      iOS, which ignores the modern name and would open Focus in a Safari tab
      with the address bar showing.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS takes the home-screen label from here, NOT from the manifest. -->
    <meta name="apple-mobile-web-app-title" content="Forge" />
    <!-- Stops iOS turning numbers in task names into phone links. -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0a0a0c" />
    <title>Forge</title>

    <!--
      The first paint, before React or any stylesheet has loaded.

      Vite injects the CSS as a <link>, so between the HTML arriving and that
      stylesheet applying there is a gap the browser fills with its own default
      white. On a reload of a dark app that reads as a flash of the wrong app.
      Inline, in the head, is the only thing that is already there.

      The spinner lives in #root and is thrown away the moment React renders
      into it, so there is nothing to tear down.
    -->
    <style>
      html, body { margin: 0; background: #0d0f12; color: #e6e8eb; }
      /*
        The splash before React exists.
        It cannot use the app's loading screen - no JS has run yet - so it is
        built to look like its opening beat instead: same wordmark, same
        cycling lines, same bar. When React mounts, ColdStart continues the
        sequence rather than replacing one loader with a different one.

        Pure CSS on purpose. Script here would delay the very bundle this is
        covering for.
      */
      #boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 26px; padding: 0 24px;
      }
      #boot .mark {
        font-weight: 900; font-size: 20px; letter-spacing: .3em;
        color: #fff;
      }
      /* The lines are stacked and each takes its turn, so no JS is needed. */
      #boot .lines {
        position: relative; height: 20px; width: 100%;
        max-width: 340px; text-align: center;
      }
      #boot .lines span {
        position: absolute; inset: 0;
        font-size: 13px; color: rgba(255,255,255,.7);
        opacity: 0;
        animation: boot-line 8s ease-in-out infinite;
      }
      #boot .lines span:nth-child(2) { animation-delay: 2s; }
      #boot .lines span:nth-child(3) { animation-delay: 4s; }
      #boot .lines span:nth-child(4) { animation-delay: 6s; }
      @keyframes boot-line {
        0%      { opacity: 0; transform: translateY(6px); }
        4%, 22% { opacity: 1; transform: none; }
        26%,100%{ opacity: 0; transform: translateY(-4px); }
      }
      #boot .bar {
        width: 100%; max-width: 340px; height: 3px; border-radius: 999px;
        background: rgba(255,255,255,.06); overflow: hidden;
      }
      #boot .bar i {
        display: block; height: 100%; width: 40%; border-radius: 999px;
        background: #c0b3a5;
        animation: boot-sweep 1.5s ease-in-out infinite;
      }
      /* Sweeps rather than fills: it has no idea how far along it is, and a
         bar that pretends to know is a bar that lies. */
      @keyframes boot-sweep {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .lines span { animation: none; opacity: 0; }
        #boot .lines span:first-child { opacity: 1; }
        #boot .bar i { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <span class="mark">FORGE</span>
        <span class="lines">
          <span>You are what you repeatedly do.</span>
          <span>Not what you meant to do.</span>
          <span>Not what you said you would.</span>
          <span>The ledger only counts what happened.</span>
        </span>
        <span class="bar"><i></i></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
