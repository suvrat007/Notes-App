<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="description" content="Focus — a gamified productivity and habit tracker" />
    <!--
      Standalone display. "mobile-web-app-capable" is the modern spelling and
      what iOS 16.4+ reads; the apple-prefixed one is still required by older
      iOS, which ignores the modern name and would open Focus in a Safari tab
      with the address bar showing.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS takes the home-screen label from here, NOT from the manifest. -->
    <meta name="apple-mobile-web-app-title" content="Focus" />
    <!-- Stops iOS turning numbers in task names into phone links. -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0a0a0c" />
    <title>Focus — Productivity Tracker</title>

    <!--
      The first paint, before React or any stylesheet has loaded.

      Vite injects the CSS as a <link>, so between the HTML arriving and that
      stylesheet applying there is a gap the browser fills with its own default
      white. On a reload of a dark app that reads as a flash of the wrong app.
      Inline, in the head, is the only thing that is already there.

      The spinner lives in #root and is thrown away the moment React renders
      into it, so there is nothing to tear down.
    -->
    <style>
      html, body { margin: 0; background: #0d0f12; color: #e6e8eb; }
      #boot {
        position: fixed; inset: 0;
        display: grid; place-items: center; gap: 18px;
        grid-auto-flow: row; align-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #boot .mark {
        font-weight: 800; font-size: 15px; letter-spacing: .32em;
        color: #c0b3a5;
      }
      #boot .ring {
        width: 26px; height: 26px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.10);
        border-top-color: #c0b3a5;
        animation: boot-spin .7s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <span class="mark">FOCUS</span>
        <span class="ring"></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
